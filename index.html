<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kanto 151">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Kanto 151 Collection Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Kanto 151 Tracker</h1>
    <div class="progress">
      <strong id="count"></strong>
      <span id="percent"></span>
      <span id="wantedCount"></span>
      <progress id="bar" value="0" max="1" aria-label="Collection progress"></progress>
    </div>
    <div class="searchbox">
      <label for="search" class="sr-only">Search by name or Pokédex number</label>
      <input id="search" type="search" placeholder="Search name or number (e.g. Pikachu, 25, #025)" autocomplete="off">
      <button id="clear" type="button" hidden>Clear</button>
    </div>
    <div class="controls">
      <label>Show <select id="filter"></select></label>
      <label>Sort <select id="sort"></select></label>
    </div>
  </header>
  <main>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>No Pokémon found</p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
